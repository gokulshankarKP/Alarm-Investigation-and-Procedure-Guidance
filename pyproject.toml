[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-investigation-copilot"
version = "1.0.0"
description = "Alarm Investigation and Procedure Guidance Copilot: MCP server + MCP client + document RAG + Streamlit GUI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "mcp>=1.30,<2",
    "langchain-core>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langchain-ollama>=1.0,<2",
    "langgraph>=1.0,<2",
    "jsonschema>=4.20,<5",
    "numpy>=1.26",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "PyYAML>=6.0,<7",
    "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.0", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
alarm-api-sim = "alarm_api_sim.__main__:main"
alarm-mcp = "alarm_mcp.__main__:main"
copilot-backend = "copilot.__main__:main"
rag-ingest = "rag.ingestion.__main__:main"

# The repository layout required by the assignment uses hyphenated folders
# (apps/backend, mcp-servers/alarm-management, ...); map them to importable packages.
[tool.setuptools]
package-dir = { "alarm_api_sim" = "apps/alarm-api-simulator/alarm_api_sim", "copilot" = "apps/backend/copilot", "copilot_ui" = "apps/frontend/copilot_ui", "alarm_mcp" = "mcp-servers/alarm-management/alarm_mcp", "connectors" = "connectors", "rag" = "rag", "shared" = "shared" }
packages = ["alarm_api_sim", "copilot", "copilot_ui", "alarm_mcp", "connectors", "connectors.alarm_api", "rag", "rag.ingestion", "rag.retrieval", "shared"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/alarm-api-simulator", "apps/backend", "apps/frontend", "mcp-servers/alarm-management"]
testpaths = ["rag/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs in-process servers (simulator + MCP server over HTTP)",
    "postgres: needs a reachable PostgreSQL with pgvector (skipped otherwise)",
    "e2e: end-to-end scenarios across GUI/backend, MCP and RAG",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "mcp-servers", "connectors", "rag", "shared"]
omit = ["*/tests/*", "*/__main__.py", "apps/frontend/copilot_ui/app.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["agent_api_and_complete_flow", "test.ipynb", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: the formatter owns line layout; remaining long lines are prose (docstrings, prompts).
ignore = ["E501", "S101", "S311", "B008", "RUF001", "RUF002", "RUF003", "RUF005", "SIM108", "S608", "UP040"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S", "B", "SIM"]
"tests/*" = ["S", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["alarm_api_sim", "alarm_mcp", "connectors", "copilot", "copilot_ui", "rag", "shared"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
implicit_optional = true  # FastMCP convention: `ctx: Context = None`
warn_unused_ignores = false
mypy_path = ["apps/alarm-api-simulator", "apps/backend", "apps/frontend", "mcp-servers/alarm-management", "."]
explicit_package_bases = true
